        /* Legenda gomb stílusa - modern, csak szöveg jellegű */
.legend-btn {
    width: 100%;
    background: rgba(0, 62, 138, 0.1);
    border: 1px dashed var(--deep-blue);
    color: #4da3ff;
    padding: 10px;
    margin-top: 15px;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
    font-size: 0.9rem;
}

.legend-btn:hover {
    background: rgba(0, 62, 138, 0.2);
}

/* Legenda belső tartalma */
.legend-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s ease-in-out;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 0 0 5px 5px;
}

.legend-content p {
    padding: 15px;
    font-style: italic;
    line-height: 1.6;
    color: #ddd;
    margin: 0;
}

.legend-content.open {
    max-height: 500px; /* Elég nagy, hogy a hosszú legendák is elférjenek */
    margin-top: 5px;
}
        :root {
            --deep-blue: #003E8A;
            --bg-dark: #121212;
            --text-white: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- NAVIGÁCIÓ --- */
        nav {
            width: 100%;
            display: flex;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 20px 40px;
            transition: 0.3s all ease;
            position: relative;
            border-bottom: 3px solid transparent;
        }

        /* Felfelé halványuló kék hatás */
        .nav-btn.active {
            background-image: linear-gradient(to top, rgba(0, 62, 138, 0.4), rgba(0, 62, 138, 0));
            border-bottom: 3px solid var(--deep-blue);
            color: #4da3ff;
        }

        /* --- OLDALAK ALAPSTÍLUSA --- */
        .page {
            display: none;
            padding-top: 100px;
            min-height: 100vh;
            animation: fadeIn 0.6s ease;
        }

        .page.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    /* --- JAVÍTOTT KEZDŐLAP ELRENDEZÉS --- */
.home-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px; /* Kisebb távolság, hogy elférjenek */
    padding: 0 5%;
    text-align: center;
}

.side-images {
    flex: 1; /* Dinamikusan kitölti a helyet */
    max-width: 200px; /* De ne legyen szélesebb 200px-nél */
    aspect-ratio: 2 / 3; /* Fix arány: mindig 2:3 lesz, nem nyúlik el! */
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 20px rgba(0, 62, 138, 0.2);
}

.side-images img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Levágja a széleket, de nem torzít */
    position: absolute;
    left: 0;
    top: 0;
    transition: opacity 1s ease-in-out;
}

/* --- MOBIL NÉZET (Telefonokra optimalizálva) --- */
@media (max-width: 768px) {
    .home-container {
        flex-direction: column; /* Egymás alá kerülnek az elemek */
        gap: 30px;
    }

    .side-images {
        width: 150px; /* Telefonon kicsit kisebbek legyenek */
        max-width: 80% ;

    }

    .main-content {
        order: -1; /* A logó és a felirat kerüljön legfelülre */
    }

    #nation {
        font-size: 2rem; /* Telefonon kisebb betű, hogy ne törjön szét */
    }
}

        #nation {

    // --- OLDALVÁLTÁS ---
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById('btn-' + pageId).classList.add('active');
    }

    // --- MAI NEMZETISÉG ---
    function setDaily() {
        const today = new Date();
        const dayNumber = today.getFullYear() * 10000 + (today.getMonth()+1) * 100 + today.getDate();
        const dailyIndex = dayNumber % nationData.length;
        document.getElementById("nation").textContent = nationData[dailyIndex].name;
    }

    // --- LISTA GENERÁLÁS ---
    function filterList(continent, btn) {
        if(btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const container = document.getElementById("nation-list-container");
        container.innerHTML = "";

        const filtered = nationData.filter(n => n.continent === continent);

        filtered.forEach(n => {
            const card = document.createElement("div");
            card.className = "nation-card";
            
            // Csak akkor rakunk legenda gombot, ha van szöveg hozzá
            const legendHTML = n.legend ? `
                <div class="legend-container">
                    <button class="legend-btn" onclick="toggleLegend(this)">
                        ✨ Eredettörténet / Legenda megnyitása
                    </button>
                    <div class="legend-content">
                        <p>${n.legend}</p>
                    </div>
                </div>` : "";

            card.innerHTML = `
                <button class="card-header" onclick="toggleCard(this)">
                    <span class="monogram">${n.monogram}</span>
                    <img src="${n.flagPath}" alt="zászló" class="flag-img" onerror="this.style.display='none'">
                    <span>${n.name}</span>
                </button>
                <div class="card-body">
                    <div class="info-grid">
                        <div class="info-section">
                            <h4>Külső vonások</h4> <p>${n.features}</p>
                            <h4>Származás</h4> <p>${n.origin}</p>
                        </div>
                        <div class="info-section">
                            <h4>Tulajdonságok</h4> <p>${n.traits}</p>
                            <h4>Érdekességek</h4> <p>${n.trivia}</p>
                        </div>
                    </div>
                    ${legendHTML}
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- KÁRTYA NYITÁS ---
    function toggleCard(btn) {
        const body = btn.nextElementSibling;
        const isOpen = body.classList.contains('open');
        document.querySelectorAll('.card-body').forEach(b => b.classList.remove('open'));
        if (!isOpen) body.classList.add('open');
    }

    function toggleLegend(btn) {
        const content = btn.nextElementSibling;
        content.classList.toggle('open');
        btn.textContent = content.classList.contains('open') ? "✨ Legenda bezárása" : "✨ Eredettörténet / Legenda megnyitása";
    }

    // --- SLIDESHOW ---
    function setupSlideshow(containerId) {
        const container = document.getElementById(containerId);
        if(!container) return;
        const imgs = container.getElementsByTagName('img');
        let current = 0;
        if(imgs.length < 2) return;

        // Csak az első legyen látható az elején
        for(let i=1; i<imgs.length; i++) imgs[i].style.opacity = 0;

        setInterval(() => {
            imgs[current].style.opacity = 0;
            current = (current + 1) % imgs.length;
            imgs[current].style.opacity = 1;
        }, 4000);
    }

    // Indítás
    window.onload = () => {
        setDaily();
        setupSlideshow('left-slideshow');
        setupSlideshow('right-slideshow');
        filterList('Európa', document.querySelector('.tab-btn'));
    };
</script>
